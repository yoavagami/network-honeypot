# Compose override for the AWS/VPS "public admin" option — an alternative to the SSH-tunnel
# default. Apply on top of the base file (and the TLS override, which must be applied first —
# this reuses its certificate):
#   docker compose -f docker-compose.yml -f infrastructure/vps/docker-compose.tls.yml \
#     -f infrastructure/vps/docker-compose.public-admin.yml up -d
# See infrastructure/vps/setup-public-admin.sh, which applies this automatically.
volumes:
  certbot_certs:
    name: honeypot_certbot_certs

services:
  admin-web:
    volumes:
      - ./infrastructure/nginx/admin-web-public-tls.rendered.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/proxy_params_admin.conf:/etc/nginx/proxy_params_admin.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /var/run
        tmpfs:
          mode: 0777
    environment:
      # Empty on purpose — see admin-web-entrypoint.sh: this means "same origin, use relative
      # /api paths", which is exactly what this Nginx config's /api/ proxy location provides.
      ADMIN_API_URL: ""
    ports:
      - "8443:443"
    read_only: true
