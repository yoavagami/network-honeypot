server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy is rendered at container start (connect-src depends on where
    # admin-api actually is) — see admin-web-entrypoint.sh.
    include /tmp/csp.conf;

    location = /config.js {
        alias /tmp/config.js;
        add_header Cache-Control "no-store" always;
    }

    # Merchant portal API (/m/*), same origin. Resolved per request: nginx starts without merchant-api.
    location /m/api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $merchant_upstream http://merchant-api:8095;
        proxy_pass $merchant_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
