server {
    listen 80 default_server;
    server_name _;

    limit_conn hp_conn 20;

    # Security headers at the edge too — belt and suspenders with the app's own headers
    # (docs/SECURITY.md §1). The app sets the deception-aware CSP; these are safe to double-set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /internal/ {
        # Never proxied to the public network — health metrics are internal-only.
        # See docs/ARCHITECTURE.md §11.
        return 404;
    }

    location /login {
        limit_req zone=hp_auth burst=5 nodelay;
        proxy_pass http://honeypot:8080;
        include /etc/nginx/proxy_params_honeypot.conf;
    }

    location /admin/login {
        limit_req zone=hp_auth burst=5 nodelay;
        proxy_pass http://honeypot:8080;
        include /etc/nginx/proxy_params_honeypot.conf;
    }

    location / {
        limit_req zone=hp_general burst=40 nodelay;
        proxy_pass http://honeypot:8080;
        include /etc/nginx/proxy_params_honeypot.conf;
    }
}
