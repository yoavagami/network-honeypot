# Merchant platform paths on the main domain (included by honeypot.conf / honeypot-tls.conf).
# Everything else on the main domain stays the honeypot. /m/api/* other than request-access is
# only served on the dashboard host (admin-web), never here; /internal/* never anywhere public.
location ~ ^/(v1/(collect|assess|feedback|assessments/|integration/status|tag\.js)|docs/integrate$|integrate/|merchants$|m/api/request-access$) {
    limit_req zone=merchant_api burst=200 nodelay;
    # Resolved per request, so nginx still starts if merchant-api is down or not deployed.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $merchant_upstream http://merchant-api:8095;
    proxy_pass $merchant_upstream;
    include /etc/nginx/proxy_params_merchant.conf;
}
