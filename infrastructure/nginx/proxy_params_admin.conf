# Shared proxy settings for admin-web's same-origin proxy to admin-api. Mirrors
# infrastructure/nginx/proxy_params_honeypot.conf's IP-preservation reasoning — see
# docs/ARCHITECTURE.md §9.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
# proxy_read_timeout is deliberately not set here: /api/stream needs 1h, and nginx rejects a
# duplicate directive, so each location in admin-web-public-tls.conf sets its own.
