# Proxy settings for the edge-sensor listener (honeypot-tls.conf, listen 8443 proxy_protocol).
# Same as proxy_params_honeypot.conf, except: the connection to nginx is plain HTTP from the
# sensor, so scheme and TLS facts come from the sensor rather than nginx's ssl variables, and the
# sensor's fingerprint TLV is passed on as X-HP-Edge (base64url JSON, see sensing/edge.ts).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-Id $req_id;
proxy_set_header X-TLS-Version "";
proxy_set_header X-TLS-Cipher "";
proxy_set_header X-ALPN-Protocol "";
proxy_set_header X-HP-Edge $proxy_protocol_tlv_0xe0;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;
proxy_buffering on;
