# Body of the api.<domain> server blocks (honeypot-tls.conf): the whole host is the merchant API.
limit_conn hp_conn 50;
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
location /internal/ { return 404; }
location /m/api/ { return 404; }
location / {
    limit_req zone=merchant_api burst=200 nodelay;
    # Resolved per request, so nginx still starts if merchant-api is down or not deployed.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $merchant_upstream http://merchant-api:8095;
    proxy_pass $merchant_upstream;
    include /etc/nginx/proxy_params_merchant.conf;
}
