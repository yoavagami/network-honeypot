# AWS/VPS "public admin" option — admin-web's own Nginx terminates TLS (reusing the main
# domain's certificate) and proxies /api/* through to admin-api on the internal Docker network,
# so the dashboard and its API calls are same-origin. No CORS relaxation, no SameSite relaxation
# — this is the thing docs/DEPLOY_RENDER.md couldn't do (Render doesn't let us front two
# services with one reverse proxy the way we can here). See infrastructure/vps/setup-public-admin.sh.
limit_req_zone $binary_remote_addr zone=admin_auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=admin_general:10m rate=10r/s;

# Who touched the public dashboard: one JSON object per line, written to a named volume
# (docker-compose.public-admin.yml) so it survives container recreation and redeploys. Fetch it
# from your laptop with infrastructure/aws/admin-access.sh. Unlike the honeypot's own telemetry,
# this keeps raw IPs: it's an access log for the operator's own admin surface, not visitor data.
log_format admin_json escape=json
  '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$request_uri",'
  '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"user_agent":"$http_user_agent","referer":"$http_referer","host":"$host",'
  '"tls":"$ssl_protocol"}';

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    access_log /var/log/admin-access/access.log admin_json;
    access_log /dev/stdout;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    root /usr/share/nginx/html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /tmp/csp.conf;

    location = /config.js {
        alias /tmp/config.js;
        add_header Cache-Control "no-store" always;
    }

    # Same login-endpoint rate limiting the public honeypot Nginx applies — defense in depth now
    # that this login form is internet-reachable too.
    location = /api/auth/login {
        limit_req zone=admin_auth burst=5 nodelay;
        proxy_pass http://admin-api:8090;
        proxy_read_timeout 15s;
        include /etc/nginx/proxy_params_admin.conf;
    }

    location = /api/stream {
        proxy_pass http://admin-api:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        include /etc/nginx/proxy_params_admin.conf;
    }

    location /api/ {
        limit_req zone=admin_general burst=20 nodelay;
        proxy_pass http://admin-api:8090;
        proxy_read_timeout 15s;
        include /etc/nginx/proxy_params_admin.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
