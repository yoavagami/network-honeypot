# Proxy settings for apps/merchant-api. Merchant traffic never reaches the honeypot app and is not
# logged as honeypot telemetry. Client address comes from nginx's own view (real_ip from the edge
# sensor's PROXY header on the 8443 listener).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-Id $req_id;
proxy_set_header X-HP-Edge "";
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;
proxy_buffering on;
