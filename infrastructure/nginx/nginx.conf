user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Request ID propagated end-to-end for correlation — see docs/SECURITY.md §22.
    map $http_x_request_id $req_id {
        default   $request_id;
        "~.+"     $http_x_request_id;
    }

    log_format hp_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"request_id":"$req_id",'
        '"remote_addr":"$remote_addr",'
        '"remote_port":"$remote_port",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_user_agent":"$http_user_agent",'
        '"http_referer":"$http_referer",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher",'
        '"server_protocol":"$server_protocol"'
        '}';

    access_log /dev/stdout hp_json;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 30;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;
    client_max_body_size 256k;

    # Deliberately conservative — see docs/ARCHITECTURE.md §14 / DEPLOYMENT.md performance notes.
    # High-volume mode tuning is a Phase 3+ exercise driven by observed traffic, not guesswork.
    limit_req_zone $binary_remote_addr zone=hp_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=hp_auth:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=hp_conn:10m;

    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
