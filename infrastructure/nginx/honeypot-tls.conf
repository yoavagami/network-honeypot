# TLS-enabled variant of honeypot.conf — used once a domain + certificate are in place (see
# infrastructure/vps/setup-tls.sh). Plain HTTP still exists only to redirect + serve ACME
# challenges for cert renewal; the honeypot itself is only served over HTTPS.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    limit_conn hp_conn 20;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /internal/ {
        return 404;
    }

    location /login {
        limit_req zone=hp_auth burst=5 nodelay;
        proxy_pass http://honeypot:8080;
        include /etc/nginx/proxy_params_honeypot.conf;
    }

    location /admin/login {
        limit_req zone=hp_auth burst=5 nodelay;
        proxy_pass http://honeypot:8080;
        include /etc/nginx/proxy_params_honeypot.conf;
    }

    location / {
        limit_req zone=hp_general burst=40 nodelay;
        proxy_pass http://honeypot:8080;
        include /etc/nginx/proxy_params_honeypot.conf;
    }
}

# Edge-sensor listener (apps/honeypot/src/edge/sensor.ts). When the edge service is running it
# owns public :443, terminates TLS after fingerprinting the ClientHello / HTTP/2 opening, and
# forwards decrypted traffic here with a PROXY v2 header: real client address + fingerprint TLV.
# Not published on the host — only reachable from the sensor on the Docker network. The
# `listen 443 ssl` block above stays as the rollback path (publish 443 from nginx again).
server {
    listen 8443 proxy_protocol default_server;
    http2 on;
    server_name _;

    # Client address from the PROXY header, trusted only from the Docker networks the sensor is on.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header proxy_protocol;
    # The PROXY v2 header (with the fingerprint TLV) must fit in the first read buffer.
    client_header_buffer_size 16k;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    limit_conn hp_conn 20;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /internal/ {
        return 404;
    }

    location /login {
        limit_req zone=hp_auth burst=5 nodelay;
        proxy_pass http://honeypot:8080;
        include /etc/nginx/proxy_params_edge.conf;
    }

    location /admin/login {
        limit_req zone=hp_auth burst=5 nodelay;
        proxy_pass http://honeypot:8080;
        include /etc/nginx/proxy_params_edge.conf;
    }

    location / {
        limit_req zone=hp_general burst=40 nodelay;
        proxy_pass http://honeypot:8080;
        include /etc/nginx/proxy_params_edge.conf;
    }
}
