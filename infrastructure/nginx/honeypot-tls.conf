# TLS-enabled variant of honeypot.conf — used once a domain + certificate are in place (see
# infrastructure/vps/setup-tls.sh). Plain HTTP still exists only to redirect + serve ACME
# challenges for cert renewal; the honeypot itself is only served over HTTPS.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    limit_conn hp_conn 20;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /internal/ {
        return 404;
    }

    location /login {
        limit_req zone=hp_auth burst=5 nodelay;
        proxy_pass http://honeypot:8080;
        include /etc/nginx/proxy_params_honeypot.conf;
    }

    location /admin/login {
        limit_req zone=hp_auth burst=5 nodelay;
        proxy_pass http://honeypot:8080;
        include /etc/nginx/proxy_params_honeypot.conf;
    }

    location / {
        limit_req zone=hp_general burst=40 nodelay;
        proxy_pass http://honeypot:8080;
        include /etc/nginx/proxy_params_honeypot.conf;
    }
}
