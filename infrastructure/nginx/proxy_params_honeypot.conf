# Shared proxy settings for the honeypot upstream. Source-IP preservation is critical here —
# see docs/ARCHITECTURE.md §9: Nginx sets these headers itself from its own view of the
# connection; it does not blindly forward whatever the client sent.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $req_id;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;
proxy_buffering on;
