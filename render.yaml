# Render Blueprint — deploys the full stack to Render, including a PUBLIC admin dashboard
# protected by the app's own login (username/password + session + CSRF), per the user/pass
# public-access tradeoff documented in docs/DEPLOY_RENDER.md. If you'd rather keep the admin
# surface off the public internet entirely, see that doc's "keeping it private instead" section
# — it's a one-field change (delete two services from this file, run admin-api/admin-web
# locally instead).
#
# Usage: https://dashboard.render.com/blueprints -> New Blueprint Instance -> point at this repo.
# A few fields below (current plan tier names, and whether `fromService` resolves a web
# service's public hostname the way used here) are this author's best understanding of Render's
# Blueprint spec at time of writing, not verified against a live account — docs/DEPLOY_RENDER.md
# has the manual fallback for anything that doesn't resolve as expected on first launch.

envVarGroups:
  - name: honeypot-shared-secrets
    envVars:
      # Shared across honeypot + admin-api so IP-hash-based correlation (what the honeypot
      # recorded) and admin-side IP search agree with each other — must not be generated
      # independently per service.
      - key: IP_HASH_SECRET
        generateValue: true

databases:
  - name: honeypot-db
    # Render retired the legacy "starter" Postgres plan naming; `free` is $0/mo but Render
    # auto-deletes the database (and everything in it) after 30 days — fine for a throwaway
    # test pass, not for anything meant to persist. Swap to `basic-256mb` (~$7/mo, no expiry)
    # if this deployment turns out to be a keeper. See docs/DEPLOY_RENDER.md.
    plan: free
    postgresMajorVersion: "16"

services:
  # Public — this is the thing that gets scanned.
  - type: web
    name: honeypot
    runtime: docker
    dockerfilePath: ./infrastructure/docker/honeypot.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - fromGroup: honeypot-shared-secrets
      - key: PGHOST
        fromDatabase: { name: honeypot-db, property: host }
      - key: PGPORT
        fromDatabase: { name: honeypot-db, property: port }
      - key: PGDATABASE
        fromDatabase: { name: honeypot-db, property: database }
      - key: HONEYPOT_DB_PASSWORD
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: HOST
        value: "0.0.0.0"
      - key: LOG_LEVEL
        value: info
      # Optional Phase 2 features — all off/empty by default, set these in the dashboard's
      # Environment tab if you want them (each needs its own external account/token — see
      # docs/ROADMAP.md Phase 2). sync: false means Render won't overwrite your value on
      # subsequent blueprint syncs once you've set it.
      - key: GEOLOCATION_ENABLED
        value: "false"
      - key: IPINFO_TOKEN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_SLACK_WEBHOOK_URL
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: SMTP_HOST
        sync: false

  # Also public — protected by the app's own auth (Argon2id password, session cookie, CSRF,
  # rate-limited login), not by network isolation. See docs/DEPLOY_RENDER.md for the tradeoff
  # this makes and what it does and doesn't protect against.
  - type: web
    name: admin-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/admin-api.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/system/health
    envVars:
      - fromGroup: honeypot-shared-secrets
      - key: PGHOST
        fromDatabase: { name: honeypot-db, property: host }
      - key: PGPORT
        fromDatabase: { name: honeypot-db, property: port }
      - key: PGDATABASE
        fromDatabase: { name: honeypot-db, property: database }
      - key: ADMIN_API_DB_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: HOST
        value: "0.0.0.0"
      - key: LOG_LEVEL
        value: info
      # admin-web and admin-api are on different onrender.com hostnames — "strict" would
      # silently drop the session cookie on every cross-origin call. CORS (below) is the real
      # access boundary here, not SameSite. See docs/SECURITY.md.
      - key: ADMIN_SESSION_SAMESITE
        value: none
      # NOT `fromService`, deliberately: this needs the browser-facing public HTTPS URL for CORS
      # origin-matching, but Render's Blueprint `fromService` only ever exposes a service's
      # *private-network* address (host/port/hostport) — confirmed against Render's own
      # Blueprint spec docs, and against a real deploy, where this resolved to an internal
      # `admin-web-xxxx:80` address the browser can't send as its Origin. There's no Blueprint
      # property that returns the public URL, so this has to be filled in by hand once you know
      # admin-web's actual onrender.com URL — see docs/DEPLOY_RENDER.md step 1.
      - key: ADMIN_WEB_ORIGIN
        sync: false
      # This one IS `fromService`, correctly: admin-api reaches the honeypot's health-check
      # endpoint server-to-server, inside Render's private network — the private hostport is
      # exactly what that call needs, unlike ADMIN_WEB_ORIGIN above.
      - key: HONEYPOT_INTERNAL_URL
        fromService: { type: web, name: honeypot, property: hostport }

  - type: web
    name: admin-web
    runtime: docker
    dockerfilePath: ./infrastructure/docker/admin-web.Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      # Read at container start, not baked into the build — see
      # infrastructure/docker/admin-web-entrypoint.sh. Same fallback note as ADMIN_WEB_ORIGIN
      # above: verify this resolves correctly, set manually + restart if not.
      - key: ADMIN_API_URL
        fromService: { type: web, name: admin-api, property: hostport }
