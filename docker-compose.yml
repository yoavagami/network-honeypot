name: network-honeypot

networks:
  public:
  internal:
  admin:

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-honeypot_owner}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-honeypot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    # Dev-only convenience port bound to loopback, so `pnpm migrate`/`pnpm seed` can run from the
    # host. Production removes this entirely — Postgres gets no published port at all. See
    # docs/DEPLOYMENT.md checklist.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # The official image's entrypoint starts as root and internally drops to the `postgres` OS
    # user itself (verified: `docker compose exec postgres ps aux` shows the server process
    # running as postgres, not root) — but needs a few specific capabilities to do that switch
    # and fix ownership on first run. Tested empirically (not guessed) against a fresh volume:
    # cap_drop ALL alone breaks initdb ("failed switching to 'postgres': operation not
    # permitted"); this minimal add-back set is what initdb + normal startup actually need.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1

  honeypot:
    build:
      context: .
      dockerfile: infrastructure/docker/honeypot.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://honeypot_role:${HONEYPOT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-honeypot}
      # Separate, tightly-scoped connection for the CRM search feature — see
      # migrations/0005_crm_customers.sql and docs/VULNERABILITY.md. Never falls back to the
      # main DATABASE_URL above; the vulnerable code path always uses this role.
      CRM_DATABASE_URL: postgres://honeypot_crm_role:${HONEYPOT_CRM_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-honeypot}
      CRM_SEARCH_VULNERABLE: ${CRM_SEARCH_VULNERABLE:-false}
      BACKDOOR_BAIT_ENABLED: ${BACKDOOR_BAIT_ENABLED:-false}
      WP_INSTALL_BAIT_ENABLED: ${WP_INSTALL_BAIT_ENABLED:-false}
      IP_HASH_SECRET: ${IP_HASH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      # Verifies signed ?lab= links minted by admin-api (same value there). Unset: all lab labels
      # are recorded as "claimed", none as ground truth.
      LAB_LINK_SECRET: ${LAB_LINK_SECRET:-}
      SCORER_ENABLED: ${SCORER_ENABLED:-true}
      SCORER_INTERVAL_MS: ${SCORER_INTERVAL_MS:-30000}
      PORT: 8080
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RAW_IP_RETENTION_DAYS: ${RAW_IP_RETENTION_DAYS:-7}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-90}
      GEOLOCATION_ENABLED: ${GEOLOCATION_ENABLED:-false}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      # Stripe TEST MODE only (shop/stripeTest.ts) — non-test keys are ignored.
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_TEST_PUBLISHABLE_KEY: ${STRIPE_TEST_PUBLISHABLE_KEY:-}
      SHOP_PAYMENT_PROVIDERS: ${SHOP_PAYMENT_PROVIDERS:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_COOLDOWN_MS: ${ALERT_COOLDOWN_MS:-900000}
      ALERT_HIGH_REQUEST_RATE_THRESHOLD: ${ALERT_HIGH_REQUEST_RATE_THRESHOLD:-100}
      ALERT_AUTH_FAILURE_THRESHOLD: ${ALERT_AUTH_FAILURE_THRESHOLD:-20}
      ALERT_ENUMERATION_THRESHOLD: ${ALERT_ENUMERATION_THRESHOLD:-50}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [public, internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    mem_limit: 512m
    cpus: 1

  admin-api:
    build:
      context: .
      dockerfile: infrastructure/docker/admin-api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin_api_role:${ADMIN_API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-honeypot}
      SESSION_SECRET: ${SESSION_SECRET}
      IP_HASH_SECRET: ${IP_HASH_SECRET}
      LAB_LINK_SECRET: ${LAB_LINK_SECRET:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      PORT: 8090
      HOST: 0.0.0.0
      ADMIN_WEB_ORIGIN: ${ADMIN_WEB_ORIGIN:-http://localhost:8081}
      HONEYPOT_INTERNAL_URL: http://honeypot:8080
      MERCHANT_INTERNAL_URL: http://merchant-api:8095
      MERCHANT_INTERNAL_TOKEN: ${MERCHANT_INTERNAL_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, admin]
    # Dev-only convenience port, bound to loopback only. Production removes this entirely —
    # the admin surface sits behind a VPN/allowlist, never a published port. See DEPLOYMENT.md.
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10002:10002"
    mem_limit: 512m
    cpus: 1

  # Merchant platform API — apps/merchant-api, docs/merchant/OPERATIONS.md. Its own database
  # ("merchant", same Postgres server) and roles; reached by nginx (public merchant paths),
  # admin-web (/m/api for the merchant portal) and admin-api (/internal, admin views).
  merchant-api:
    build:
      context: .
      dockerfile: infrastructure/docker/merchant-api.Dockerfile
    restart: unless-stopped
    environment:
      MERCHANT_APP_DATABASE_URL: postgres://merchant_app:${MERCHANT_APP_DB_PASSWORD}@postgres:5432/merchant
      MERCHANT_ADMIN_DATABASE_URL: postgres://merchant_admin:${MERCHANT_ADMIN_DB_PASSWORD}@postgres:5432/merchant
      MERCHANT_TOKEN_SECRET: ${MERCHANT_TOKEN_SECRET}
      MERCHANT_ENCRYPTION_KEY: ${MERCHANT_ENCRYPTION_KEY}
      MERCHANT_INTERNAL_TOKEN: ${MERCHANT_INTERNAL_TOKEN}
      IP_HASH_SECRET: ${IP_HASH_SECRET}
      # Same secret as the honeypot: signed ?lab= links also work on merchant sites.
      LAB_LINK_SECRET: ${LAB_LINK_SECRET:-}
      MERCHANT_ALERT_URL: ${MERCHANT_ALERT_URL:-}
      MERCHANT_ALERT_IGNORE_IPS: ${MERCHANT_ALERT_IGNORE_IPS:-}
      MERCHANT_PUBLIC_API_URL: ${MERCHANT_PUBLIC_API_URL:-http://localhost:8095}
      MERCHANT_TAG_BASE_URL: ${MERCHANT_TAG_BASE_URL:-http://localhost:8095}
      MERCHANT_DASHBOARD_URL: ${MERCHANT_DASHBOARD_URL:-http://localhost:8081}
      MERCHANT_DASHBOARD_ORIGINS: ${MERCHANT_DASHBOARD_ORIGINS:-}
      MERCHANT_COOKIE_SECURE: ${MERCHANT_COOKIE_SECURE:-true}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      TRUST_PROXY_HOPS: 1
      PORT: 8095
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [public, internal, admin]
    # Dev-only convenience port, loopback only (production reaches it through nginx).
    ports:
      - "127.0.0.1:8095:8095"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10003:10003"
    mem_limit: 384m
    cpus: 1

  admin-web:
    build:
      context: .
      dockerfile: infrastructure/docker/admin-web.Dockerfile
      args:
        VITE_ADMIN_API_URL: ${ADMIN_API_PUBLIC_URL:-http://localhost:8090}
    restart: unless-stopped
    depends_on: [admin-api]
    environment:
      # "" = the merchant portal calls /m/api on its own origin; admin-web's nginx proxies it.
      MERCHANT_API_URL: ""
    networks: [admin]
    ports:
      - "127.0.0.1:8081:80"
    read_only: true
    volumes:
      # mode: 0777 on all three — default tmpfs mount ownership doesn't let uid 101 write into
      # it otherwise. /tmp specifically also needs to be writable now for the runtime
      # config.js the entrypoint renders — see admin-web-entrypoint.sh.
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /var/run
        tmpfs:
          mode: 0777
    # Run as the image's nginx user directly (not root→setuid) — nginx only tries to chown its
    # temp/cache paths when starting as root, which fails under cap_drop: [ALL]. Skipping the
    # root phase entirely avoids needing CAP_CHOWN back.
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [honeypot, merchant-api]
    volumes:
      - ./infrastructure/nginx/honeypot.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/proxy_params_honeypot.conf:/etc/nginx/proxy_params_honeypot.conf:ro
      - ./infrastructure/nginx/proxy_params_merchant.conf:/etc/nginx/proxy_params_merchant.conf:ro
      - ./infrastructure/nginx/merchant_locations.conf:/etc/nginx/merchant_locations.conf:ro
      - ./infrastructure/nginx/merchant_api_host.conf:/etc/nginx/merchant_api_host.conf:ro
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /var/run
        tmpfs:
          mode: 0777
    networks: [public]
    ports:
      - "8080:80"
    read_only: true
    tmpfs: [/tmp]
    user: "101:101"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 1
