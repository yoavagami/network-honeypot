name: network-honeypot

networks:
  public:
  internal:
  admin:

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-honeypot_owner}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-honeypot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    # Dev-only convenience port bound to loopback, so `pnpm migrate`/`pnpm seed` can run from the
    # host. Production removes this entirely — Postgres gets no published port at all. See
    # docs/DEPLOYMENT.md checklist.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1

  honeypot:
    build:
      context: .
      dockerfile: infrastructure/docker/honeypot.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://honeypot_role:${HONEYPOT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-honeypot}
      IP_HASH_SECRET: ${IP_HASH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      PORT: 8080
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [public, internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    mem_limit: 512m
    cpus: 1

  admin-api:
    build:
      context: .
      dockerfile: infrastructure/docker/admin-api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin_api_role:${ADMIN_API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-honeypot}
      SESSION_SECRET: ${SESSION_SECRET}
      IP_HASH_SECRET: ${IP_HASH_SECRET}
      PORT: 8090
      HOST: 0.0.0.0
      ADMIN_WEB_ORIGIN: ${ADMIN_WEB_ORIGIN:-http://localhost:8081}
      HONEYPOT_INTERNAL_URL: http://honeypot:8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, admin]
    # Dev-only convenience port, bound to loopback only. Production removes this entirely —
    # the admin surface sits behind a VPN/allowlist, never a published port. See DEPLOYMENT.md.
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10002:10002"
    mem_limit: 512m
    cpus: 1

  admin-web:
    build:
      context: .
      dockerfile: infrastructure/docker/admin-web.Dockerfile
      args:
        VITE_ADMIN_API_URL: ${ADMIN_API_PUBLIC_URL:-http://localhost:8090}
    restart: unless-stopped
    depends_on: [admin-api]
    networks: [admin]
    ports:
      - "127.0.0.1:8081:80"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /var/run
        tmpfs:
          mode: 0777
    # Run as the image's nginx user directly (not root→setuid) — nginx only tries to chown its
    # temp/cache paths when starting as root, which fails under cap_drop: [ALL]. Skipping the
    # root phase entirely avoids needing CAP_CHOWN back. The tmpfs mode above covers the
    # remaining case (default tmpfs mount ownership doesn't let uid 101 mkdir into it).
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [honeypot]
    volumes:
      - ./infrastructure/nginx/honeypot.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/proxy_params_honeypot.conf:/etc/nginx/proxy_params_honeypot.conf:ro
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          mode: 0777
      - type: tmpfs
        target: /var/run
        tmpfs:
          mode: 0777
    networks: [public]
    ports:
      - "8080:80"
    read_only: true
    tmpfs: [/tmp]
    user: "101:101"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 1
